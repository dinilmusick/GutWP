name: CI
on: [push,pull_request]
jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.2'}
      - run: php tools/validate.php
      - run: composer validate --strict
      - run: php tests/fod_json_fail_closed.php
      - run: php tests/api-registry-invariants.php
      - run: php tests/json_wp_fail_closed.php
